name: Scheduled Validation

on:
  schedule:
    - cron: '0 9 * * 1' # every Monday at 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read
  issues: write

jobs:
  validate-defaults:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./
        with:
          docs: docs/
          title: Starlight Action Docs

      - name: Verify Pages artifact was uploaded
        uses: actions/github-script@v8
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const pages = artifacts.data.artifacts.find(a => a.name === 'github-pages');
            if (!pages) {
              core.setFailed('Expected github-pages artifact was not found');
            } else {
              core.info(`Found github-pages artifact (${pages.size_in_bytes} bytes)`);
            }

  validate-with-theme:
    needs: validate-defaults
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./
        with:
          docs: docs/
          title: Starlight Action Docs (Themed)
          theme: starlight-theme-rapide
          theme_plugin: starlightThemeRapide

      - name: Verify Pages artifact was uploaded
        uses: actions/github-script@v8
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const pages = artifacts.data.artifacts.find(a => a.name === 'github-pages');
            if (!pages) {
              core.setFailed('Expected github-pages artifact was not found');
            } else {
              core.info(`Found github-pages artifact (${pages.size_in_bytes} bytes)`);
            }

  open-issue-on-failure:
    runs-on: ubuntu-latest
    needs: [validate-defaults, validate-with-theme]
    if: failure()
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const title = 'Scheduled validation failed: default versions may be incompatible';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'validation-failure',
            });
            if (issues.find(i => i.title === title)) {
              core.info('Issue already open, skipping');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ['validation-failure'],
              body: [
                'The weekly scheduled validation workflow failed.',
                '',
                `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'This usually means a new Astro or Starlight release broke compatibility',
                'with the default version ranges in `src/scaffold.ts`.',
                '',
                '**To fix:**',
                '1. Check the workflow run logs for the specific error',
                '2. Find a compatible Astro + Starlight version pair',
                '3. Update `ASTRO_VERSION` and `STARLIGHT_VERSION` in `src/scaffold.ts`',
                '4. Run `npm run build` to rebuild `dist/index.js`',
              ].join('\n'),
            });

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # dist/ freshness check disabled — ncc produces different output on
      # Windows vs Linux, making cross-platform verification impossible.
      # See: https://github.com/vercel/ncc/issues/831
      # The pre-commit hook (.hooks/pre-commit) rebuilds dist/ on source changes.
      # - name: Verify dist/ is up to date
      #   run: |
      #     if [ -n "$(git diff --name-only dist/)" ]; then
      #       echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
      #       git diff --stat dist/
      #       exit 1
      #     fi
